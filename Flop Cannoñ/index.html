<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2aa8f2">
<title>Flop Cannoñ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3a2408;--gold:#ffd23a;--orange:#ff9d2e;--green:#43c94f;--red:#ff4d3d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#2aa8f2;touch-action:none;
    font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;color:#fff}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .sh{text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.25)}
  #hudL{position:fixed;top:max(10px,env(safe-area-inset-top));left:14px;z-index:5}
  #lvl{font-size:22px;letter-spacing:.5px}
  .icons{display:flex;gap:8px;margin-top:6px}
  .ib{width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.18);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer;padding:0}
  .ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  #hudR{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:5;display:flex;gap:8px;align-items:flex-start}
  .pills{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:20px;padding:3px 6px 3px 12px;font-size:18px;min-width:78px;justify-content:flex-end}
  .gem{width:18px;height:18px;background:linear-gradient(135deg,#ff7ae0,#b44bff);transform:rotate(45deg) scale(.8);border-radius:3px;border:2px solid #fff}
  .coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0 0 18%,#ffd23a 20% 62%,#e3a200 64%);border:2px solid #fff;flex:none;display:inline-block}
  #shopBtn{width:44px;height:40px;border-radius:10px;border:none;background:rgba(0,0,0,.28);cursor:pointer;display:grid;place-items:center;padding:0}
  #shopBtn svg{width:26px;height:26px;fill:#fff}
  #foes{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
  #foes i{width:16px;height:16px;border-radius:50%;background:#ffd23a;border:2px solid rgba(0,0,0,.35);display:block;transition:.25s}
  #foes i.dead{background:#6d7380;transform:scale(.8)}
  #hint{position:fixed;left:0;right:0;bottom:14%;text-align:center;font-size:30px;pointer-events:none;z-index:5;display:none}
  #hint b{display:inline-block;animation:bob 1s ease-in-out infinite;font-weight:normal}
  #hint .ring{width:58px;height:58px;border:4px solid #fff;border-radius:50%;margin:0 auto 10px;animation:ping 1s ease-out infinite}
  @keyframes bob{50%{transform:scale(1.08)}}
  @keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
  .ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,rgba(0,20,60,.15),rgba(0,10,40,.6));padding:16px}
  .ov.show{display:flex}
  .bigT{font-size:clamp(44px,10vw,84px);line-height:.92;text-align:center;color:var(--gold);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;
    transform:rotate(-3deg);text-shadow:0 6px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.7,.4,1);letter-spacing:1px}
  .bigT.red{color:#ff6a4d}
  @keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
  .reward{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:28px;background:rgba(0,0,0,.35);padding:6px 16px;border-radius:24px;animation:pop .5s .15s both}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:22px;width:min(240px,70vw);animation:pop .5s .25s both}
  .btn{font-family:inherit;font-size:24px;color:#fff;border:none;border-radius:14px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 4px 0 rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.5px}
  .btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
  .btn.o{background:linear-gradient(#ffb44d,#ff8a1e)} .btn.g{background:linear-gradient(#5fe06a,#2fae3c)} .btn.b{background:linear-gradient(#58b4ff,#2a7fe0)}
  .btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  #shop .panel{background:#1d3d6e;border-radius:22px;padding:18px;width:min(460px,100%);max-height:88vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.3);border:4px solid #fff}
  #shop h2{margin:0 0 4px;text-align:center;font-weight:normal;font-size:32px}
  .skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
  .skin{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;border:3px solid transparent}
  .skin.eq{border-color:var(--gold)}
  .skin canvas{position:static;width:100%;height:56px}
  .skin .nm{font-size:16px;margin:4px 0}
  .skin .pr{font-size:15px;display:flex;align-items:center;justify-content:center;gap:5px;opacity:.95}
  .skin .pr .coin{width:15px;height:15px}
  .skin.locked.poor{opacity:.55}
  #title{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,40,90,.1),rgba(0,20,60,.55))}
  #title.hide{display:none}
  #title .bigT span{display:block;color:#ff6a4d;font-size:1.12em}
  #title p{font-size:20px;margin:16px 0 0;text-align:center;max-width:340px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hudL">
  <div id="lvl" class="sh">Level 1</div>
  <div class="icons">
    <button class="ib" id="restartBtn" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
    <button class="ib" id="muteBtn" aria-label="Toggle sound"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
  </div>
</div>
<div id="foes"></div>
<div id="hudR">
  <button id="shopBtn" aria-label="Gun shop"><svg viewBox="0 0 24 24"><path d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2zm0 3h6V6H9v1zm-5 5v2h16v-2H4z"/></svg></button>
  <div class="pills">
    <div class="pill sh"><span id="gemTxt">0</span><span class="gem"></span></div>
    <div class="pill sh"><span id="coinTxt">0</span><span class="coin"></span></div>
  </div>
</div>
<div id="hint" class="sh"><div class="ring"></div><b>TAP TO SHOOT!</b></div>

<div id="title">
  <div class="bigT">FLOP<span>CANNOÑ</span></div>
  <p class="sh">Tap to fire the spinning gun. Every shot kicks it back, so time your shots and don't let it hit the ground!</p>
  <div class="btns"><button class="btn g" id="playBtn">PLAY</button></div>
</div>

<div id="complete" class="ov">
  <div class="bigT">LEVEL<br>COMPLETE</div>
  <div class="reward sh">+<span id="rewardTxt">0</span><span class="coin"></span></div>
  <div class="btns">
    <button class="btn o" id="replayBtn">REPLAY <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
    <button class="btn g" id="nextBtn">NEXT <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="failed" class="ov">
  <div class="bigT red">LEVEL<br>FAILED</div>
  <div class="reward sh" id="failWhy" style="font-size:20px">The gun hit the ground!</div>
  <div class="btns"><button class="btn o" id="retryBtn">TRY AGAIN <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button></div>
</div>

<div id="shop" class="ov">
  <div class="panel">
    <h2 class="sh">GUN SHOP</h2>
    <div style="display:flex;justify-content:center"><div class="pill sh"><span id="shopCoins">0</span><span class="coin"></span></div></div>
    <div class="skins" id="skins"></div>
    <button class="btn b" id="shopClose" style="width:100%">BACK</button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// =====================================================================
//  Save
// =====================================================================
const SAVE_KEY = 'flopCannon.v2';
const save = { level: 1, coins: 0, gems: 0, skin: 0, owned: [0], muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

const SKINS = [
  { name: 'Classic',   main: 0x2f74e8, dark: 0x1c3f8f, grip: 0x22335e, accent: 0xff4b4b, cost: 0 },
  { name: 'Gold Rush', main: 0xffc93a, dark: 0xd18f00, grip: 0x5a3a12, accent: 0xffffff, cost: 150 },
  { name: 'Crimson',   main: 0xe8333a, dark: 0x8f1c22, grip: 0x2b2b2b, accent: 0xffd23a, cost: 250 },
  { name: 'Jungle',    main: 0x5c8a3a, dark: 0x3b5a24, grip: 0x5a4022, accent: 0xc9b26b, cost: 350 },
  { name: 'Bubblegum', main: 0xff7ad0, dark: 0xc94aa3, grip: 0x7a3fd1, accent: 0x7ae8ff, cost: 500 },
  { name: 'Shadow',    main: 0x2b2f38, dark: 0x16181d, grip: 0x0d0e10, accent: 0x40ffb0, cost: 750 },
  { name: 'Frost',     main: 0xbfeaff, dark: 0x6cb8e0, grip: 0x3a6a8a, accent: 0xffffff, cost: 1000 },
];

// =====================================================================
//  Audio (synthesized)
// =====================================================================
let AC = null, master = null;
function initAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = save.muted ? 0 : 0.55; master.connect(AC.destination); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = 0.2, to = null, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let nbuf = null;
function noise(dur, vol = 0.3, freq = 1000, type = 'lowpass', delay = 0) {
  if (!AC) return;
  if (!nbuf) { nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  shot()  { noise(0.14, 0.55, 1400, 'highpass'); noise(0.18, 0.5, 500); tone(170, 0.1, 'square', 0.12, 60); },
  hit()   { tone(130, 0.14, 'sine', 0.35, 45); noise(0.08, 0.25, 600); },
  wood()  { tone(260, 0.1, 'triangle', 0.2, 140); noise(0.07, 0.25, 1800, 'bandpass'); },
  ping()  { tone(1800, 0.08, 'triangle', 0.06, 900); },
  boom()  { noise(0.8, 0.9, 600); tone(100, 0.6, 'sine', 0.7, 30); },
  thud(v) { tone(110, 0.1, 'sine', clamp(v, 0.04, 0.3), 45); },
  rumble(){ noise(0.5, 0.35, 200); },
  win()   { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, null, i * 0.08)); },
  fail()  { [440, 370, 311, 247].forEach((f, i) => tone(f, 0.25, 'sawtooth', 0.08, null, i * 0.12)); },
  click() { tone(700, 0.05, 'triangle', 0.12); },
  coin()  { tone(988, 0.07, 'square', 0.05); tone(1319, 0.12, 'square', 0.05, null, 0.06); },
};

// =====================================================================
//  Renderer / scene
// =====================================================================
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
const camBase = new THREE.Vector3(), camLook = new THREE.Vector3();

function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4; return t;
}
const skyTex = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#0a64d6'); gr.addColorStop(0.55, '#2aa8f2'); gr.addColorStop(1, '#8fe0ff');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
skyTex.wrapS = skyTex.wrapT = THREE.ClampToEdgeWrapping;
scene.background = skyTex;
scene.fog = new THREE.Fog(0x8fd8ff, 45, 170);

const hemi = new THREE.HemisphereLight(0xe8f6ff, 0x3a5a3a, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 16, bottom: -6, near: 1, far: 80 });
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);
const flashLight = new THREE.PointLight(0xffd36b, 0, 8); scene.add(flashLight);

function speckle(base, cols, n, size) {
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; const s = Math.random() * size + 1; g.fillRect(Math.random() * w, Math.random() * h, s, s); }
  };
}
const TEX = {
  grass: canvasTex(256, 256, speckle('#2f8c3c', ['#3aa04a', '#24722f', '#46b357', '#1f6629', '#58c068'], 2600, 3), 60, 60),
  asphalt: canvasTex(256, 256, speckle('#4a5566', ['#56627a', '#3d4656', '#606c82'], 1800, 2), 60, 60),
  path: canvasTex(128, 128, speckle('#b9bec8', ['#c7ccd4', '#a9afba', '#d2d6dd'], 900, 2), 1, 20),
  wood: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#e2a877'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) { g.fillStyle = '#c98a58'; g.fillRect(0, y, w, 3); }
    g.strokeStyle = 'rgba(150,90,45,.35)'; g.lineWidth = 1;
    for (let i = 0; i < 26; i++) { const y = Math.random() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 4, w * .6, y - 4, w, y + 2); g.stroke(); }
  }),
  crate: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#d9995f'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#9c5f2c'; g.lineWidth = 12; g.strokeRect(6, 6, w - 12, h - 12);
    g.lineWidth = 10; g.beginPath(); g.moveTo(12, 12); g.lineTo(w - 12, h - 12); g.stroke();
    g.strokeStyle = 'rgba(120,70,30,.3)'; g.lineWidth = 1;
    for (let y = 20; y < h; y += 18) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  }),
  tnt: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#d8322a'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#9e1d18'; g.fillRect(0, 16, w, 10); g.fillRect(0, h - 26, w, 10);
    g.fillStyle = '#fff'; g.fillRect(14, 44, w - 28, 40);
    g.fillStyle = '#d8322a'; g.font = 'bold 34px Arial Black, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('TNT', w / 2, 65);
  }),
  building: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#3f5b86'; g.fillRect(0, 0, w, h);
    for (let y = 10; y < h; y += 32) for (let x = 10; x < w; x += 30) { g.fillStyle = Math.random() < 0.25 ? '#9fc6ee' : '#2c4266'; g.fillRect(x, y, 16, 20); }
  }),
  rock: canvasTex(128, 128, speckle('#6b6e78', ['#7b7f8a', '#5a5d66', '#878b96'], 900, 4)),
};
const MAT = {
  grass: new THREE.MeshLambertMaterial({ map: TEX.grass }),
  asphalt: new THREE.MeshLambertMaterial({ map: TEX.asphalt }),
  path: new THREE.MeshLambertMaterial({ map: TEX.path }),
  wood: new THREE.MeshLambertMaterial({ map: TEX.wood }),
  crate: new THREE.MeshLambertMaterial({ map: TEX.crate }),
  tnt: new THREE.MeshLambertMaterial({ map: TEX.tnt }),
  tntTop: new THREE.MeshLambertMaterial({ color: 0xb8231c }),
  building: new THREE.MeshLambertMaterial({ map: TEX.building }),
  roof: new THREE.MeshLambertMaterial({ color: 0x55739e }),
  rock: new THREE.MeshLambertMaterial({ map: TEX.rock }),
  boulder: new THREE.MeshLambertMaterial({ color: 0x1d2440, flatShading: true }),
  stone: new THREE.MeshLambertMaterial({ color: 0x8c93a3 }),
  metal: new THREE.MeshLambertMaterial({ color: 0x2a2d33 }),
  trunk: new THREE.MeshLambertMaterial({ color: 0x7a4b25 }),
  leaf: new THREE.MeshLambertMaterial({ color: 0x2f9a45, flatShading: true }),
  bgBuild: new THREE.MeshLambertMaterial({ color: 0x5d86b8 }),
};
for (const k in MAT) MAT[k].userData.shared = true;

function makeSoftTex() {
  return canvasTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.5, 'rgba(255,255,255,.7)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });
}
function makeStarTex() {
  return canvasTex(64, 64, (g) => {
    g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? 12 : 28; g.lineTo(32 + Math.cos(a) * rr, 32 + Math.sin(a) * rr); }
    g.closePath(); g.fillStyle = '#ffe34d'; g.fill(); g.lineWidth = 4; g.strokeStyle = '#c98a00'; g.stroke();
  });
}
const softTex = makeSoftTex(), starTex = makeStarTex();
softTex.wrapS = softTex.wrapT = starTex.wrapS = starTex.wrapT = THREE.ClampToEdgeWrapping;

// =====================================================================
//  Physics (2D Verlet in the x/y plane; meshes are rendered in 3D)
// =====================================================================
const DT = 1 / 120, GRAV = -22, ITER = 10;
let statics = [], bodies = [], enemies = [];
let levelRoot = new THREE.Group(); scene.add(levelRoot);
const fxRoot = new THREE.Group(); scene.add(fxRoot);

function P(x, y, r, im, z = 0, fric = 0.8) { return { x, y, px: x, py: y, r, im, z, fric, contact: false, cnx: 0, cny: 0 }; }
function solveStick(s) {
  const a = s.a, b = s.b, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6, w = a.im + b.im;
  if (!w) return;
  const k = (d - s.len) / (d * w) * s.k;
  a.x += dx * k * a.im; a.y += dy * k * a.im; b.x -= dx * k * b.im; b.y -= dy * k * b.im;
}
function addStatic(cx, cy, hx, hy, a = 0, o = {}) {
  const s = { cx, cy, hx, hy, a, c: Math.cos(a), s: Math.sin(a), ground: !!o.ground };
  statics.push(s);
  if (o.mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(hx * 2, hy * 2, o.depth || 5), o.mat);
    m.position.set(cx, cy, o.z || 0); m.rotation.z = a; m.receiveShadow = true; m.castShadow = o.cast !== false;
    levelRoot.add(m); s.mesh = m;
  }
  return s;

};
function proceduralLevel(L, n) {
  const keys = Object.keys(MODULES);
  const a = keys[Math.floor(L.rng() * keys.length)];
  let b = keys[Math.floor(L.rng() * keys.length)];
  if (a === 'roof' && b === 'roof') b = 'plat';
  MODULES[a](L, 1.5 + L.rng());
  MODULES[b](L, 7.5 + L.rng());
  L.gun(-6.5, 7.5);
  if (n % 7 === 0) { L.lose(-10.5); L.enemy(13, 0, { pose: 'walk', speed: 1.1 }); }
}

function disposeTree(o) {
  o.traverse(m => {
    if (m.geometry && m.geometry !== tracerGeo) m.geometry.dispose();
    if (m.material) (Array.isArray(m.material) ? m.material : [m.material]).forEach(mt => { if (!mt.userData.shared) mt.dispose(); });
  });
}

function buildScenery(L, rng) {
  const city = L.theme === 'city';
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), city ? MAT.asphalt : MAT.grass);
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; levelRoot.add(g);
  if (L.pathX != null) { const p = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 120), MAT.path); p.rotation.x = -Math.PI / 2; p.position.set(L.pathX, 0.01, -50); p.receiveShadow = true; levelRoot.add(p); }
  if (city) {
    for (let i = 0; i < 26; i++) {
      const w = 3 + rng() * 5, h = 6 + rng() * 22, d = 4 + rng() * 4;
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), i % 3 ? MAT.bgBuild : MAT.building);
      m.position.set(-40 + i * 3.6 + rng() * 3, h / 2, -22 - rng() * 30); levelRoot.add(m);
    }
  } else {
    for (let i = 0; i < 34; i++) {
      const x = -45 + rng() * 90, z = -14 - rng() * 50, s = 0.8 + rng() * 1.2;
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.25 * s, 1.4 * s, 6), MAT.trunk); t.position.set(x, 0.7 * s, z); levelRoot.add(t);
      const l = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1 * s, 0), MAT.leaf); l.position.set(x, 2.1 * s, z); levelRoot.add(l);
    }
  }
  for (let i = 0; i < 8; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xffffff, opacity: 0.85, transparent: true, depthWrite: false, fog: false }));
    s.position.set(-60 + rng() * 120, 22 + rng() * 14, -70 - rng() * 30); s.scale.set(14 + rng() * 10, 5 + rng() * 2, 1); levelRoot.add(s);
  }
}

function loadLevel(n) {
  scene.remove(levelRoot); disposeTree(levelRoot); levelRoot = new THREE.Group(); scene.add(levelRoot);
  for (const f of fxList) { fxRoot.remove(f.s); f.s.material.dispose(); } fxList.length = 0;
  for (const t of tracers) { fxRoot.remove(t.m); t.m.material.dispose(); } tracers.length = 0;
  statics = []; bodies = []; enemies = []; loseX = null; pendingKills.length = 0;
  level = n; simT = 0; runCoins = 0; slowmo = 0; endT = 0; physAcc = 0;
  const rng = mulberry32(n * 7919 + 13);
  const L = builder(rng);
  addStatic(0, -5, 400, 5, 0, { ground: true });
  state = 'loading';
  if (n <= LEVELS.length) LEVELS[n - 1](L); else proceduralLevel(L, n);
  gun.x = gun.x0 = L.gunAt[0]; gun.y = gun.y0 = L.gunAt[1]; gun.vx = gun.vy = 0; gun.a = -0.4; gun.w = 1.6; gun.cool = 0; gun.trail = 0;
  bounds = L.b;
  buildScenery(L, rng);
  frameCamera(bounds);
  // let stacks settle before the player sees them (walkers don't move yet)
  const walkers = enemies.filter(e => e.pose === 'walk'); walkers.forEach(e => e.pose = 'stand');
  for (let i = 0; i < 40; i++) physStep();
  walkers.forEach(e => e.pose = 'walk');
  for (const e of enemies) if (e.support) { const f = boxFrame(e.support); e.sup0 = [f.cx, f.cy]; }
  simT = 0;
  state = 'ready';
  $('hint').style.display = L.hint ? 'block' : 'none';
  showOv(null); updateHud();
}

// =====================================================================
//  Camera
// =====================================================================
function frameCamera(b) {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
  const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  const corners = [[b.x0, b.y0], [b.x1, b.y0], [b.x0, b.y1], [b.x1, b.y1]];
  let D = 8;
  for (let i = 0; i < 80; i++) {
    camera.position.set(cx + D * 0.1, cy + D * 0.3, D); camera.lookAt(cx, cy - 1, 0); camera.updateMatrixWorld();
    let ok = true;
    for (const [x, y] of corners) { vA.set(x, y, 0).project(camera); if (Math.abs(vA.x) > 1.0 || vA.y < -1.0 || vA.y > 0.84) { ok = false; break; } }
    if (ok) break; D *= 1.05;
  }
  camBase.copy(camera.position); camLook.set(cx, cy - 1, 0);
  sun.position.set(cx - 10, 24, 16); sun.target.position.set(cx, 0, 0);
}
addEventListener('resize', () => { if (bounds) frameCamera(bounds); });

// =====================================================================
//  Game flow
// =====================================================================
let state = 'title', simT = 0, runCoins = 0, slowmo = 0, endT = 0, shake = 0, physAcc = 0;

function shoot() {
  if (gun.cool > 0) return;
  if (state !== 'ready' && state !== 'play' && state !== 'won') return;
  if (state === 'ready') { state = 'play'; $('hint').style.display = 'none'; }
  gun.cool = 0.11;
  const dx = Math.cos(gun.a), dy = Math.sin(gun.a);
  const mx = gun.x + dx * 0.68, my = gun.y + dy * 0.68;
  const hit = raycast(mx, my, dx, dy, 45);
  const hx = mx + dx * hit.t, hy = my + dy * hit.t;
  tracer(mx, my, hx, hy);
  sfx.shot(); shake = Math.max(shake, 0.06);
  sprite(mx, my, 0, { color: 0xffe27a, add: true, size: 0.75, life: 0.07 });
  sprite(mx + dx * 0.2, my + dy * 0.2, 0, { color: 0xffffff, add: true, size: 0.4, life: 0.05 });
  for (let i = 0; i < 4; i++) sprite(mx, my, 0, { color: 0xffffff, op: 0.6, size: 0.25, vx: dx * 1.5 + (Math.random() - .5), vy: dy * 1.5 + Math.random(), life: 0.5, grow: 0.8 });
  flashLight.position.set(mx, my, 0.6); flashLight.intensity = 2.2; flashLight.distance = 6;

  if (hit.kind === 'rag') {
    const e = hit.b;
    if (e.alive) killEnemy(e, dx * 15, dy * 15 + 3, [hx, hy]);
    else { for (const p of e.pts) { const w = Math.exp(-((p.x - hx) ** 2 + (p.y - hy) ** 2) / 0.3); p.px -= dx * 9 * w * DT; p.py -= (dy * 9 + 2) * w * DT; } sfx.hit(); }
    burstFx(hx, hy, 6, 0xffffff, 2.5);
  } else if (hit.kind === 'box') {
    const b = hit.b;
    if (b.kind === 'tnt') explode(b);
    else {
      unpin(b);
      const k = 9 / (b.hw * b.hh * 4 * b.density + 0.6);
      for (const p of b.pts) { const w = 1 / (0.4 + Math.hypot(p.x - hx, p.y - hy)); p.px -= dx * k * w * DT; p.py -= dy * k * w * DT; }
      sfx.wood(); burstFx(hx, hy, 6, 0xe2a877, 2.5);
    }
  } else if (hit.kind === 'ball') {
    const p = hit.b.pts[0]; p.px -= dx * 1.5 * DT; sfx.ping(); burstFx(hx, hy, 5, 0xbbbbbb, 2);
  } else if (hit.kind === 'static') {
    sfx.ping(); burstFx(hx, hy, 6, 0xffe9a0, 2.5);
  }
  // recoil: knocked back and spun
  gun.vx -= dx * GUN.recoil; gun.vy -= dy * GUN.recoil; gun.vy += GUN.lift;
  gun.w += GUN.kick;
  gun.trail = 0.55;
}

function winLevel() { state = 'won'; slowmo = 0.9; endT = 1.9; }
function failLevel(why) {
  if (state !== 'play') return;
  state = 'lost'; endT = 1.1; $('failWhy').textContent = why; sfx.fail();
}
function showOv(id) { for (const o of ['complete', 'failed', 'shop']) $(o).classList.toggle('show', o === id); }

function updateGun(dt) {
  if (state === 'ready' || state === 'title' || (state === 'shop' && shopReturn === 'ready')) {
    gun.x = gun.x0; gun.y = gun.y0 + Math.sin(performance.now() / 500) * 0.15; gun.a += 1.8 * dt;
  } else if (state !== 'shop') {
    gun.vy -= GUN.g * dt;
    const damp = Math.exp(-0.45 * dt); gun.vx *= damp; gun.vy *= damp;
    const sp = Math.hypot(gun.vx, gun.vy); if (sp > 13) { gun.vx *= 13 / sp; gun.vy *= 13 / sp; }
    gun.x += gun.vx * dt; gun.y += gun.vy * dt;
    gun.w = lerp(gun.w, GUN.base, 1 - Math.exp(-1.6 * dt));
    gun.a += gun.w * dt;
    if (gun.x < bounds.x0 + 0.4) { gun.x = bounds.x0 + 0.4; gun.vx = Math.abs(gun.vx) * 0.5; }
    if (gun.x > bounds.x1 - 0.4) { gun.x = bounds.x1 - 0.4; gun.vx = -Math.abs(gun.vx) * 0.5; }
    if (gun.y > bounds.y1 - 0.3) { gun.y = bounds.y1 - 0.3; gun.vy = Math.min(gun.vy, 0); }
    const p = { x: gun.x, y: gun.y, r: GUN.r, contact: false, cnx: 0, cny: 0 };
    const s = collideStatic(p);
    if (s) {
      if (s.ground) {
        if (state === 'play') { failLevel('The gun hit the ground!'); burstFx(gun.x, 0.1, 10, 0xc9a173, 3); sfx.thud(0.3); }
        gun.y = p.y; gun.vy = Math.abs(gun.vy) * 0.35; gun.vx *= 0.6; gun.w *= 0.5;
      } else {
        gun.x = p.x; gun.y = p.y;
        const vn = gun.vx * p.cnx + gun.vy * p.cny;
        if (vn < 0) { gun.vx -= 1.45 * vn * p.cnx; gun.vy -= 1.45 * vn * p.cny; sfx.ping(); }
      }
    }
  }
  gun.cool = Math.max(0, gun.cool - dt);
  if (gun.trail > 0) {
    gun.trail -= dt;
    if (Math.random() < 0.8) sprite(gun.x - Math.cos(gun.a) * 0.1, gun.y - Math.sin(gun.a) * 0.1, -0.05, { color: 0xffffff, op: 0.55 * (gun.trail / 0.55) + 0.1, size: 0.22, life: 0.6, grow: 0.5, vy: 0.2 });
  }
  gun.mesh.position.set(gun.x, gun.y, 0);
  gun.mesh.rotation.set(0, 0, gun.a);
}

function update(rdt) {
  if (state === 'title' || state === 'shop') { updateGun(rdt); return; }
  let ts = 1;
  if (slowmo > 0) { slowmo -= rdt; ts = 0.3; }
  const dt = rdt * ts;
  physAcc += dt;
  let n = 0; while (physAcc >= DT && n < 12) { physStep(); physAcc -= DT; n++; }
  if (n >= 12) physAcc = 0;
  updateGun(dt);
  if (state === 'play' && loseX != null) for (const e of enemies) if (e.alive && e.x < loseX) { failLevel('An enemy got away!'); break; }
  if (state === 'won' || state === 'lost') {
    endT -= rdt;
    if (endT <= 0) {
      if (state === 'won') {
        state = 'complete';
        const bonus = 40 + level * 5; save.coins += bonus; runCoins += bonus; save.gems += 1;
        save.level = level + 1; persist();
        $('rewardTxt').textContent = runCoins; showOv('complete'); sfx.win(); updateHud();
      } else { state = 'failed'; persist(); showOv('failed'); }
    }
  }
}

function renderFrame(rdt) {
  for (const b of bodies) {
    if (b.type === 'rag') renderEnemy(b, rdt);
    else if (b.type === 'box') { const f = boxFrame(b); b.mesh.position.set(f.cx, f.cy, b.z || 0); b.mesh.rotation.set(0, 0, Math.atan2(f.uy, f.ux)); }
    else if (b.type === 'ball') { const p = b.pts[0]; b.mesh.position.set(p.x, p.y, 0); b.mesh.rotation.set(0, 0, b.roll); }
  }
  for (let i = fxList.length - 1; i >= 0; i--) {
    const f = fxList[i]; f.life -= rdt;
    if (f.life <= 0) { fxRoot.remove(f.s); f.s.material.dispose(); fxList.splice(i, 1); continue; }
    f.vy += f.g * rdt; f.s.position.x += f.vx * rdt; f.s.position.y += f.vy * rdt; f.s.position.z += f.vz * rdt;
    if (f.grow) { const s = f.s.scale.x + f.grow * rdt; f.s.scale.set(s, s, 1); }
    f.s.material.opacity = f.op * clamp(f.life / f.max * 1.5, 0, 1);
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i]; t.life -= rdt;
    if (t.life <= 0) { fxRoot.remove(t.m); t.m.material.dispose(); tracers.splice(i, 1); continue; }
    t.m.material.opacity = t.life / 0.13;
  }
  flashLight.intensity = Math.max(0, flashLight.intensity - rdt * 30);
  shake = Math.max(0, shake - rdt * 1.2);
  camera.position.copy(camBase);
  if (shake > 0) camera.position.add(vA.set((Math.random() - .5) * shake, (Math.random() - .5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
}

// =====================================================================
//  HUD / UI
// =====================================================================
function updateHud() {
  $('lvl').textContent = 'Level ' + level;
  $('coinTxt').textContent = save.coins; $('gemTxt').textContent = save.gems;
  const foes = $('foes');
  if (foes.childElementCount !== enemies.length) { foes.innerHTML = ''; enemies.forEach(() => foes.appendChild(document.createElement('i'))); }
  enemies.forEach((e, i) => { const el = foes.children[i]; el.className = e.alive ? '' : 'dead'; el.style.background = e.alive ? '#' + e.color.getHexString() : ''; });
}
function syncMute() {
  $('muteIco').innerHTML = save.muted
    ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'
    : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>';
  if (master) master.gain.value = save.muted ? 0 : 0.55;
}
let shopReturn = 'ready';
function openShop() {
  if (state === 'shop' || state === 'title') return;
  shopReturn = state; state = 'shop'; renderShop(); showOv('shop'); sfx.click();
}
function closeShop() {
  sfx.click(); state = shopReturn;
  showOv(shopReturn === 'complete' ? 'complete' : shopReturn === 'failed' ? 'failed' : null);
}
function skinPreview(cv, sk) {
  const g = cv.getContext('2d'); cv.width = 200; cv.height = 90;
  const hex = c => '#' + c.toString(16).padStart(6, '0');
  g.translate(90, 49); g.rotate(-0.08);
  g.fillStyle = hex(sk.grip); g.save(); g.translate(-30, 12); g.rotate(0.3); g.fillRect(-14, -6, 28, 46); g.restore();
  g.fillStyle = hex(sk.dark); g.fillRect(-50, 0, 96, 16);
  g.fillStyle = hex(sk.main); g.fillRect(-58, -20, 124, 24);
  g.fillStyle = hex(sk.accent); g.fillRect(-14, -16, 50, 6);
  g.fillStyle = '#1a1c20'; g.fillRect(64, -16, 10, 14);
}
function renderShop() {
  $('shopCoins').textContent = save.coins;
  const wrap = $('skins'); wrap.innerHTML = '';
  SKINS.forEach((sk, i) => {
    const owned = save.owned.includes(i), eq = save.skin === i;
    const d = document.createElement('div');
    d.className = 'skin' + (eq ? ' eq' : '') + (owned ? '' : ' locked') + (!owned && save.coins < sk.cost ? ' poor' : '');
    const cv = document.createElement('canvas'); skinPreview(cv, sk); d.appendChild(cv);
    d.insertAdjacentHTML('beforeend', `<div class="nm">${sk.name}</div><div class="pr">${eq ? 'EQUIPPED' : owned ? 'TAP TO EQUIP' : `<span class="coin"></span>${sk.cost}`}</div>`);
    d.onclick = () => {
      if (owned) { save.skin = i; setSkin(i); persist(); sfx.click(); renderShop(); }
      else if (save.coins >= sk.cost) { save.coins -= sk.cost; save.owned.push(i); save.skin = i; setSkin(i); persist(); sfx.win(); renderShop(); updateHud(); }
      else sfx.fail();
    };
    wrap.appendChild(d);
  });
}

$('playBtn').onclick = () => { initAudio(); sfx.click(); $('title').classList.add('hide'); loadLevel(save.level); };
$('replayBtn').onclick = () => { sfx.click(); loadLevel(level); };
$('nextBtn').onclick = () => { sfx.click(); loadLevel(level + 1); };
$('retryBtn').onclick = () => { sfx.click(); loadLevel(level); };
$('restartBtn').onclick = () => { initAudio(); sfx.click(); if (state !== 'title' && state !== 'shop') loadLevel(level); };
$('muteBtn').onclick = () => { initAudio(); save.muted = !save.muted; persist(); syncMute(); };
$('shopBtn').onclick = () => { initAudio(); openShop(); };
$('shopClose').onclick = closeShop;
canvas.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); shoot(); });
addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  e.preventDefault(); initAudio();
  if (state === 'title') $('playBtn').click();
  else if (state === 'complete') $('nextBtn').click();
  else if (state === 'failed') $('retryBtn').click();
  else if (state !== 'shop') shoot();
});
syncMute();

// =====================================================================
//  Boot
// =====================================================================
setSkin(save.skin);
loadLevel(save.level);
state = 'title';
$('hint').style.display = 'none';
let last = performance.now();
function frame(t) {
  const rdt = Math.min(0.05, (t - last) / 1000); last = t;
  update(rdt); renderFrame(rdt);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); });
requestAnimationFrame(frame);

// small hook used by automated tests
window.__fc = { get state() { return state; }, get level() { return level; }, get gun() { return gun; },
  get alive() { return enemies.filter(e => e.alive).length; }, enemies: () => enemies, shoot, loadLevel, save,
  bodies: () => bodies.filter(b => b.type !== 'rag').map(b => b.type === 'ball' ? ['ball', b.pts[0].x.toFixed(2), b.pts[0].y.toFixed(2)] : ['box', boxFrame(b).cx.toFixed(2), boxFrame(b).cy.toFixed(2), b.pinned]),
  aimAt(x, y) { gun.a = Math.atan2(y - gun.y, x - gun.x); gun.w = 0; gun.cool = 0; },
  sim(sec) { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); } };
})();
</script>
</body>
</html>
