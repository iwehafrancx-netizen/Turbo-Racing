<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5ec8ff">
<title>Flop Cannoñ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1d0e; --gold:#ffcb2e; --gold-d:#d99a00; --red:#ff4d3d; --red-d:#b8261a;
    --green:#4fd16a; --green-d:#23913a; --blue:#3aa0ff; --blue-d:#1a63b8; --cream:#fff6e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#5ec8ff;touch-action:none;
    font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;color:#fff}
  canvas{display:block;position:fixed;inset:0}
  .txt{text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 3px 0 var(--ink),-2px 3px 0 var(--ink)}
  #hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 16px 16px}
  #dist{font-size:44px;line-height:1}
  #best{font-size:16px;opacity:.95;margin-top:4px}
  #coinBox{position:absolute;top:max(12px,env(safe-area-inset-top));right:64px;display:flex;align-items:center;gap:8px;font-size:26px}
  .coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8 0 20%,var(--gold) 21% 60%,var(--gold-d) 61%);border:3px solid var(--ink);display:inline-block;flex:none}
  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);
    background:var(--cream);font-size:20px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);z-index:20;padding:0}
  #hint{position:fixed;left:0;right:0;bottom:16%;text-align:center;font-size:28px;pointer-events:none;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  #boostBtn{position:fixed;right:18px;bottom:max(22px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;
    border:4px solid var(--ink);background:radial-gradient(circle at 40% 35%,#ff8a7d,var(--red) 55%,var(--red-d));color:#fff;
    font-family:inherit;font-size:20px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:none;z-index:10;line-height:1}
  #boostBtn small{display:block;font-size:14px;margin-top:2px}
  #boostBtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  #boostBtn.empty{filter:grayscale(1) brightness(.8)}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:15;background:rgba(20,40,70,.25);padding:16px}
  .overlay.show{display:flex}
  .card{background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:26px;padding:22px 22px 24px;width:min(420px,100%);
    text-align:center;box-shadow:0 10px 0 var(--ink);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .title{font-size:clamp(46px,13vw,72px);line-height:.9;color:var(--gold);margin:0 0 6px;transform:rotate(-4deg)}
  .title span{display:block;color:var(--red);font-size:1.15em}
  .sub{font-size:18px;margin:10px 0 18px;color:var(--ink)}
  .btn{font-family:inherit;font-size:28px;color:#fff;border:4px solid var(--ink);border-radius:18px;padding:12px 18px;width:100%;
    cursor:pointer;margin-top:12px;box-shadow:0 6px 0 var(--ink);background:var(--green);letter-spacing:.5px}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  .btn.blue{background:var(--blue)} .btn.red{background:var(--red)}
  .btn.small{font-size:20px;padding:8px 12px;width:auto;margin:0;min-width:92px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn.small .coin{width:18px;height:18px;border-width:2px}
  .btn:disabled{filter:grayscale(1);opacity:.6}
  .stat{display:flex;justify-content:space-between;align-items:center;font-size:22px;padding:8px 4px;border-bottom:3px dashed rgba(43,29,14,.2)}
  .stat b{font-weight:normal;color:var(--red-d)}
  .big{font-size:64px;line-height:1;color:var(--gold);margin:4px 0 8px}
  .badge{display:inline-block;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 12px;font-size:20px;transform:rotate(-3deg);margin-bottom:6px}
  .upg{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 0;border-bottom:3px dashed rgba(43,29,14,.2)}
  .upg .ico{width:48px;height:48px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:26px;flex:none}
  .upg .info{flex:1;min-width:0}
  .upg .name{font-size:20px}
  .upg .desc{font-size:14px;opacity:.75;font-family:system-ui,sans-serif;font-weight:700}
  .pips{display:flex;gap:3px;margin-top:4px}
  .pips i{width:12px;height:8px;border-radius:3px;background:rgba(43,29,14,.18)}
  .pips i.on{background:var(--green)}
  .bal{display:flex;align-items:center;justify-content:center;gap:8px;font-size:26px;margin-bottom:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="dist" class="txt">0 m</div>
  <div id="best" class="txt">Best 0 m</div>
  <div id="coinBox" class="txt"><span class="coin"></span><span id="coinTxt">0</span></div>
</div>
<button id="mute" aria-label="Toggle sound">🔊</button>
<div id="hint" class="txt" style="display:none"></div>
<button id="boostBtn"><span>BOOST</span><small id="boostCount">x2</small></button>

<div id="menu" class="overlay show">
  <div class="card">
    <h1 class="title txt">FLOP<span>CANNOÑ</span></h1>
    <p class="sub">Blast the dummy out of the cannon and see how far it flops!</p>
    <button class="btn" id="playBtn">PLAY</button>
    <button class="btn blue" id="shopBtn1">UPGRADES</button>
  </div>
</div>

<div id="result" class="overlay">
  <div class="card">
    <div id="newBest" class="badge" style="display:none">NEW BEST!</div>
    <div style="font-size:24px">YOU FLOPPED</div>
    <div class="big txt" id="resDist">0 m</div>
    <div class="stat"><span>Max height</span><b id="resHeight">0 m</b></div>
    <div class="stat"><span>Coins picked up</span><b id="resPick">0</b></div>
    <div class="stat"><span>Distance bonus</span><b id="resBonus">0</b></div>
    <div class="stat"><span>Total coins</span><b id="resTotal" style="display:flex;align-items:center;gap:6px">0</b></div>
    <button class="btn" id="againBtn">FIRE AGAIN</button>
    <button class="btn blue" id="shopBtn2">UPGRADES</button>
  </div>
</div>

<div id="shop" class="overlay">
  <div class="card">
    <div style="font-size:34px;margin-bottom:6px">UPGRADES</div>
    <div class="bal"><span class="coin"></span><span id="shopCoins">0</span></div>
    <div id="upgList"></div>
    <button class="btn" id="shopBack">LET'S FLOP</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ============================================================
//  Save data
// ============================================================
const SAVE_KEY = 'flopCannon.save.v1';
const save = { coins: 0, best: 0, power: 0, bounce: 0, boosts: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const UPGRADES = [
  { key: 'power',  name: 'Cannon Power', icon: '💥', color: '#ff8a5c', max: 10, desc: l => `Launch speed +${l * 8}%` },
  { key: 'bounce', name: 'Bouncy Suit',  icon: '🦘', color: '#7fd8ff', max: 10, desc: l => `Bounces +${l * 6}% higher` },
  { key: 'boosts', name: 'Rocket Boosts', icon: '🚀', color: '#ffd84d', max: 5, desc: l => `${2 + l} mid-air boosts per shot` },
];
const upgCost = k => Math.round(25 * Math.pow(save[k] + 1, 1.6));

// ============================================================
//  Constants & helpers
// ============================================================
const DT = 1 / 120;          // physics step
const G = 1500;              // gravity px/s^2
const PX_PER_M = 10;
const AIR = 0.9995;
const CANNON_X = 0, PIVOT_Y = -46, BARREL_LEN = 96;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ============================================================
//  Audio (all synthesized, no files)
// ============================================================
let AC = null, master = null, muted = false;
try { muted = localStorage.getItem('flopCannon.muted') === '1'; } catch (e) {}
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol = 0.3, freq = 1000, type = 'lowpass') {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  boom()  { noise(0.7, 0.9, 700); tone(110, 0.5, 'sine', 0.7, 35); },
  boing() { tone(180, 0.35, 'sine', 0.35, 520); tone(360, 0.2, 'triangle', 0.12, 900); },
  coin()  { tone(988, 0.07, 'square', 0.06); tone(1319, 0.14, 'square', 0.06, null, 0.06); },
  pop()   { noise(0.12, 0.5, 2500, 'highpass'); tone(600, 0.08, 'triangle', 0.15, 200); },
  thud(v) { tone(140, 0.12, 'sine', clamp(v, 0.05, 0.35), 50); noise(0.08, clamp(v, 0.05, 0.3) * 0.6, 400); },
  boost() { noise(0.45, 0.4, 1800, 'bandpass'); tone(220, 0.4, 'sawtooth', 0.08, 660); },
  zoom()  { tone(300, 0.3, 'square', 0.08, 1200); },
  stick() { tone(300, 0.25, 'sawtooth', 0.12, 80); },
  click() { tone(660, 0.05, 'triangle', 0.12); },
  win()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.15, null, i * 0.09)); },
  tick(p) { tone(300 + p * 600, 0.03, 'square', 0.03); },
};

// ============================================================
//  Canvas
// ============================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, baseZ = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  baseZ = clamp(Math.min(H / 640, W / 420), 0.55, 1.6);
}
addEventListener('resize', resize); resize();

// ============================================================
//  Game state
// ============================================================
let state = 'menu';             // menu | aim | power | fly | result | shop
let angle = 45, aimT = 0, powerV = 0, powerT = 0, lastTick = 0;
let rag = null;
let objs = [], coins = [], parts = [], texts = [];
let nextX = 600, rng = Math.random;
const cam = { x: 0, y: -170, z: 1 };
let shake = 0, recoil = 0, time = 0, flash = 0;
const run = { coins: 0, boosts: 0, maxH: 0, still: 0, stuck: false, ko: 0, lastThud: 0, dist: 0 };

// ============================================================
//  Ragdoll (Verlet particles + distance constraints)
// ============================================================
function makeRag(x, y) {
  const P = (dx, dy, r) => ({ x: x + dx, y: y + dy, px: x + dx, py: y + dy, r });
  const p = {
    head: P(0, -46, 12), neck: P(0, -32, 6), hip: P(0, 0, 7),
    lElb: P(-12, -22, 5), lHand: P(-20, -11, 5), rElb: P(12, -22, 5), rHand: P(20, -11, 5),
    lKnee: P(-6, 16, 5), lFoot: P(-8, 32, 6), rKnee: P(6, 16, 5), rFoot: P(8, 32, 6),
  };
  const S = (a, b, k = 1) => ({ a: p[a], b: p[b], len: Math.hypot(p[a].x - p[b].x, p[a].y - p[b].y), k });
  const sticks = [
    S('head', 'neck'), S('neck', 'hip'),
    S('neck', 'lElb'), S('lElb', 'lHand'), S('neck', 'rElb'), S('rElb', 'rHand'),
    S('hip', 'lKnee'), S('lKnee', 'lFoot'), S('hip', 'rKnee'), S('rKnee', 'rFoot'),
    S('head', 'hip', 0.35),   // keeps the head from folding into the chest
    S('lKnee', 'rKnee', 0.05),
  ];
  return { p, list: Object.values(p), sticks, grounded: false };
}
function ragVel() {
  let vx = 0, vy = 0;
  for (const q of rag.list) { vx += q.x - q.px; vy += q.y - q.py; }
  const n = rag.list.length; return [vx / n / DT, vy / n / DT];
}
function addVel(vx, vy) { for (const q of rag.list) { q.px -= vx * DT; q.py -= vy * DT; } }
function setVel(vx, vy) { for (const q of rag.list) { q.px = q.x - vx * DT; q.py = q.y - vy * DT; } }
function setVy(vy) { for (const q of rag.list) q.py = q.y - vy * DT; }

const groundBounce = () => 0.3 + save.bounce * 0.02;
const trampMult = () => 1 + save.bounce * 0.06;

function physStep() {
  const fric = 0.975;
  rag.grounded = false;
  let impact = 0;
  for (const q of rag.list) {
    const vx = (q.x - q.px) * AIR, vy = (q.y - q.py) * AIR;
    q.px = q.x; q.py = q.y;
    q.x += vx; q.y += vy + G * DT * DT;
    if (q.y > -q.r) {
      const ivy = q.y - q.py;
      impact = Math.max(impact, ivy / DT);
      q.y = -q.r;
      q.py = q.y + ivy * groundBounce();
      q.px = q.x - vx * fric;
      rag.grounded = true;
    }
  }
  for (let it = 0; it < 8; it++) {
    for (const s of rag.sticks) {
      const a = s.a, b = s.b, dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1e-4, diff = (d - s.len) / d * 0.5 * s.k;
      a.x += dx * diff; a.y += dy * diff; b.x -= dx * diff; b.y -= dy * diff;
    }
    for (const q of rag.list) if (q.y > -q.r) q.y = -q.r;
  }
  if (run.stuck) for (const q of rag.list) { q.px = lerp(q.px, q.x, 0.5); q.py = lerp(q.py, q.y, 0.5); }

  if (impact > 550 && time - run.lastThud > 0.12) {
    run.lastThud = time;
    sfx.thud(impact / 3000);
    if (impact > 1100) { run.ko = 1.2; shake = Math.max(shake, impact / 160); dust(rag.p.hip.x, 0, 8); }
  }
  interact();
}

// ============================================================
//  World objects
// ============================================================
function spawnAhead(limit) {
  while (nextX < limit) {
    const m = nextX / PX_PER_M;
    const bag = [['tramp', 30], ['tnt', 20], ['balloon', 18], ['pad', 12], ['ring', 10]];
    if (m > 250) bag.push(['cactus', 5 + Math.min(8, m / 150)]);
    let total = 0; for (const b of bag) total += b[1];
    let r = rng() * total, type = 'tramp';
    for (const b of bag) { if ((r -= b[1]) <= 0) { type = b[0]; break; } }
    if (m < 40) type = 'tramp';

    if (type === 'balloon') {
      const n = 1 + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) objs.push({ type, x: nextX + i * 70, y: -150 - rng() * 380, hue: Math.floor(rng() * 5), phase: rng() * 6 });
    } else if (type === 'ring') {
      objs.push({ type, x: nextX, y: -140 - rng() * 320 });
    } else {
      objs.push({ type, x: nextX, w: { tramp: 110, tnt: 44, pad: 130, cactus: 40 }[type], t: 0 });
    }
    if (rng() < 0.6) {
      const n = 5 + Math.floor(rng() * 4), cx = nextX + 160 + rng() * 120, cy = -70 - rng() * 300;
      for (let i = 0; i < n; i++) coins.push({ x: cx + i * 34, y: cy - Math.sin(i / (n - 1) * Math.PI) * 60 });
    }
    nextX += 380 + rng() * 560 + Math.min(m, 3000) * 0.25;
  }
}

function anyPointIn(x0, y0, x1, y1) {
  for (const q of rag.list) if (q.x + q.r > x0 && q.x - q.r < x1 && q.y + q.r > y0 && q.y - q.r < y1) return true;
  return false;
}
function anyPointNear(x, y, rad) {
  for (const q of rag.list) { const dx = q.x - x, dy = q.y - y, rr = rad + q.r; if (dx * dx + dy * dy < rr * rr) return true; }
  return false;
}

function interact() {
  const [vx, vy] = ragVel();
  const hip = rag.p.hip;
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i];
    if (Math.abs(o.x - hip.x) > 220) continue;
    switch (o.type) {
      case 'tramp':
        if (o.t <= 0 && vy > 40 && anyPointIn(o.x, -40, o.x + o.w, 0)) {
          const up = Math.max(Math.abs(vy) * 0.85 + 350, 1150) * trampMult();
          setVy(-Math.min(up, 3200));
          if (vx < 420) addVel(420 - vx, 0);
          o.t = 0.35; o.squash = 1; sfx.boing(); popText(o.x + o.w / 2, -70, 'BOING!', '#7fd8ff');
          burst(o.x + o.w / 2, -24, 10, ['#fff', '#7fd8ff'], 300);
        }
        break;
      case 'tnt':
        if (anyPointIn(o.x - 4, -54, o.x + o.w + 4, 0)) {
          objs.splice(i, 1);
          addVel(650, 0); setVy(Math.min(vy, 0) - 1250);
          sfx.boom(); shake = 22; flash = 0.5; run.ko = 1;
          explosion(o.x + o.w / 2, -25); popText(o.x + 20, -110, 'KABOOM!', '#ffb03a');
        }
        break;
      case 'balloon': {
        const by = o.y + Math.sin(time * 2 + o.phase) * 8;
        if (anyPointNear(o.x, by, 26)) {
          objs.splice(i, 1);
          setVy(Math.min(vy, 0) - 700); addVel(120, 0);
          sfx.pop(); burst(o.x, by, 14, [BALLOON_COLORS[o.hue], '#fff'], 260); popText(o.x, by - 40, 'POP!', BALLOON_COLORS[o.hue]);
        }
        break;
      }
      case 'pad':
        if (!o.used && anyPointIn(o.x, -24, o.x + o.w, 0)) {
          o.used = true; addVel(900, 0); setVy(Math.min(vy, 0) - 420);
          sfx.zoom(); popText(o.x + o.w / 2, -70, 'ZOOM!', '#ffe14d'); burst(o.x + o.w / 2, -10, 12, ['#ffe14d', '#fff'], 250);
        }
        break;
      case 'ring':
        if (!o.used && anyPointNear(o.x, o.y, 44)) {
          o.used = true; addVel(700, 0); setVy(Math.min(vy, -150));
          sfx.zoom(); sfx.coin(); popText(o.x, o.y - 70, 'TURBO!', '#ffd23a'); burst(o.x, o.y, 18, ['#ffd23a', '#fff6b0'], 320);
        }
        break;
      case 'cactus':
        if (!run.stuck && anyPointIn(o.x, -80, o.x + o.w, 0)) {
          run.stuck = true; setVel(0, 0); sfx.stick(); run.ko = 5;
          popText(o.x + 20, -120, 'OUCH!', '#7cff8a'); shake = 8;
        }
        break;
    }
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (Math.abs(c.x - hip.x) > 120) continue;
    if (anyPointNear(c.x, c.y, 22)) {
      coins.splice(i, 1); run.coins++; sfx.coin(); burst(c.x, c.y, 5, ['#ffd23a', '#fff'], 150);
    }
  }
}

// ============================================================
//  FX
// ============================================================
const BALLOON_COLORS = ['#ff4d6d', '#ffb02e', '#4fd16a', '#3aa0ff', '#b46bff'];
function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, max: 0.9, size: 3 + Math.random() * 4, color: colors[i % colors.length], g: 600 });
  }
}
function explosion(x, y) {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 500;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 150, life: 0.4 + Math.random() * 0.5, max: 0.9, size: 8 + Math.random() * 14,
      color: ['#fff3a0', '#ffb02e', '#ff5a2e', '#ffd84d'][i % 4], g: -100, grow: 30 });
  }
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI * Math.random(), s = 50 + Math.random() * 160;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1 + Math.random() * 0.6, max: 1.6, size: 14 + Math.random() * 12, color: '#7a7a7a', g: -60, grow: 25, smoke: true });
  }
}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - 0.5) * 30, y: y - 4, vx: (Math.random() - 0.5) * 200, vy: -Math.random() * 160,
    life: 0.5 + Math.random() * 0.3, max: 0.8, size: 6 + Math.random() * 6, color: '#c9a173', g: 200, grow: 12, smoke: true });
}
function popText(x, y, s, color) { texts.push({ x, y, s, color, life: 1 }); }

// ============================================================
//  Flow
// ============================================================
const $ = id => document.getElementById(id);
const hud = { dist: $('dist'), best: $('best'), coin: $('coinTxt'), hint: $('hint'), boost: $('boostBtn'), boostCount: $('boostCount') };

function show(id) { for (const o of ['menu', 'result', 'shop']) $(o).classList.toggle('show', o === id); }
function setHint(t) { hud.hint.style.display = t ? 'block' : 'none'; hud.hint.textContent = t || ''; }

function resetWorld() {
  rng = mulberry32((Math.random() * 1e9) | 0);
  objs = []; coins = []; parts = []; texts = [];
  nextX = 600; rag = null; recoil = 0;
  Object.assign(run, { coins: 0, boosts: 2 + save.boosts, maxH: 0, still: 0, stuck: false, ko: 0, dist: 0 });
  spawnAhead(4000);
}

function startAim() {
  initAudio();
  resetWorld();
  state = 'aim'; aimT = 0; show(null);
  setHint('TAP to lock the angle');
  hud.boost.style.display = 'none';
}

function fire() {
  const a = angle * Math.PI / 180;
  const speed = 1550 * (1 + save.power * 0.08) * (0.4 + 0.6 * powerV);
  const mx = CANNON_X + Math.cos(a) * BARREL_LEN, my = PIVOT_Y - Math.sin(a) * BARREL_LEN;
  rag = makeRag(mx, my + 10);
  setVel(Math.cos(a) * speed, -Math.sin(a) * speed);
  // a little spin so it tumbles
  rag.p.head.px -= 2.5; rag.p.lFoot.px += 2; rag.p.rFoot.px += 2;
  state = 'fly'; recoil = 1; shake = 14; flash = 0.35;
  sfx.boom();
  for (let i = 0; i < 18; i++) {
    const s = 150 + Math.random() * 350, aa = a + (Math.random() - 0.5) * 0.7;
    parts.push({ x: mx, y: my, vx: Math.cos(aa) * s, vy: -Math.sin(aa) * s, life: 0.6 + Math.random() * 0.6, max: 1.2, size: 10 + Math.random() * 12, color: i % 3 ? '#e8e8e8' : '#ffb02e', g: -40, grow: 30, smoke: i % 3 !== 0 });
  }
  setHint('');
  updateBoostBtn(); hud.boost.style.display = 'block';
}

function useBoost() {
  if (state !== 'fly' || run.stuck) return;
  if (run.boosts <= 0) { sfx.click(); return; }
  run.boosts--;
  const [, vy] = ragVel();
  addVel(380, 0); setVy(Math.min(vy, 0) - 650);
  sfx.boost(); shake = Math.max(shake, 5);
  const h = rag.p.hip;
  for (let i = 0; i < 16; i++) parts.push({ x: h.x, y: h.y, vx: -200 - Math.random() * 300, vy: 150 + Math.random() * 300 * (Math.random() - 0.3),
    life: 0.4 + Math.random() * 0.3, max: 0.7, size: 8 + Math.random() * 8, color: ['#fff3a0', '#ffb02e', '#ff5a2e'][i % 3], g: 0, grow: 10 });
  popText(h.x, h.y - 60, 'BOOST!', '#ff8a5c');
  updateBoostBtn();
}
function updateBoostBtn() { hud.boostCount.textContent = 'x' + run.boosts; hud.boost.classList.toggle('empty', run.boosts <= 0); }

function endRun() {
  state = 'result';
  hud.boost.style.display = 'none';
  const dist = Math.floor(run.dist);
  const bonus = Math.floor(dist / 15);
  const total = run.coins + bonus;
  const isBest = dist > save.best;
  if (isBest) save.best = dist;
  save.coins += total; persist();
  $('resDist').textContent = dist + ' m';
  $('resHeight').textContent = Math.floor(run.maxH) + ' m';
  $('resPick').textContent = run.coins;
  $('resBonus').textContent = bonus;
  $('resTotal').innerHTML = '<span class="coin" style="width:18px;height:18px;border-width:2px"></span>+' + total;
  $('newBest').style.display = isBest ? 'inline-block' : 'none';
  if (isBest) sfx.win();
  setTimeout(() => { if (state === 'result') show('result'); }, 350);
}

function openShop() {
  state = state === 'result' || state === 'menu' ? state : state;
  sfx.click(); renderShop(); show('shop');
}
function renderShop() {
  $('shopCoins').textContent = save.coins;
  const list = $('upgList'); list.innerHTML = '';
  for (const u of UPGRADES) {
    const lvl = save[u.key], maxed = lvl >= u.max, c = upgCost(u.key);
    const row = document.createElement('div'); row.className = 'upg';
    row.innerHTML = `<div class="ico" style="background:${u.color}">${u.icon}</div>
      <div class="info"><div class="name">${u.name}</div><div class="desc">${u.desc(lvl)}</div>
      <div class="pips">${Array.from({ length: u.max }, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div></div>`;
    const b = document.createElement('button'); b.className = 'btn small';
    b.innerHTML = maxed ? 'MAX' : `<span class="coin"></span>${c}`;
    b.disabled = maxed || save.coins < c;
    b.onclick = () => { if (save.coins >= c && !maxed) { save.coins -= c; save[u.key]++; persist(); sfx.win(); renderShop(); } };
    row.appendChild(b); list.appendChild(row);
  }
}

$('playBtn').onclick = () => { sfx.click(); startAim(); };
$('againBtn').onclick = () => { sfx.click(); startAim(); };
$('shopBtn1').onclick = () => { initAudio(); openShop(); };
$('shopBtn2').onclick = openShop;
$('shopBack').onclick = () => { sfx.click(); startAim(); };
$('boostBtn').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); useBoost(); });
const muteBtn = $('mute');
function syncMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; if (master) master.gain.value = muted ? 0 : 0.6; }
muteBtn.onclick = () => { initAudio(); muted = !muted; try { localStorage.setItem('flopCannon.muted', muted ? '1' : '0'); } catch (e) {} syncMute(); };
syncMute();

function tap() {
  initAudio();
  if (state === 'aim') { state = 'power'; powerT = 0; sfx.click(); setHint('TAP to FIRE!'); }
  else if (state === 'power') fire();
  else if (state === 'fly') useBoost();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'menu' || state === 'result') { sfx.click(); startAim(); } else tap();
  }
});

// ============================================================
//  Update
// ============================================================
let acc = 0;
function update(dt) {
  time += dt;
  recoil = Math.max(0, recoil - dt * 3);
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 2);

  if (state === 'aim') {
    aimT += dt; angle = 45 + 33 * Math.sin(aimT * 2.4 - Math.PI / 2 + 0.6);
  } else if (state === 'power') {
    powerT += dt; powerV = 0.5 - 0.5 * Math.cos(powerT * 3.4);
    if (time - lastTick > 0.07) { lastTick = time; sfx.tick(powerV); }
  }

  if ((state === 'fly' || state === 'result') && rag) {
    acc += dt;
    while (acc >= DT) { physStep(); acc -= DT; }
    run.ko = Math.max(0, run.ko - dt);
    const hip = rag.p.hip;
    if (state === 'fly') {
      run.dist = Math.max(run.dist, (hip.x - CANNON_X) / PX_PER_M);
      run.maxH = Math.max(run.maxH, -rag.p.head.y / PX_PER_M);
      const [vx, vy] = ragVel(), sp = Math.hypot(vx, vy);
      if ((rag.grounded && sp < 35) || run.stuck) run.still += dt; else run.still = 0;
      if (run.still > (run.stuck ? 1.4 : 0.9)) endRun();
      spawnAhead(hip.x + 3000);
      objs = objs.filter(o => o.x > hip.x - 1500);
      coins = coins.filter(c => c.x > hip.x - 1500);
    }
  }

  // camera
  let tx, ty, tz;
  if (rag) {
    const h = rag.p.hip;
    const alt = Math.max(0, -h.y - 150);
    tz = baseZ * clamp(560 / (560 + alt * 0.45), 0.5, 1);
    tx = h.x + 60 / tz;
    ty = Math.min(-170, h.y + 60);
    // keep the ground in view while it's reasonably close
    const groundScreen = (0 - ty) * tz + H * 0.5;
    if (groundScreen > H * 0.95) ty = Math.max(ty, -H * 0.45 / tz);
  } else {
    tz = baseZ; tx = CANNON_X + W * 0.17 / tz; ty = -170;
  }
  const k = 1 - Math.pow(0.0001, dt);
  cam.x = lerp(cam.x, tx, rag ? Math.min(1, dt * 9) : k);
  cam.y = lerp(cam.y, ty, Math.min(1, dt * 6));
  cam.z = lerp(cam.z, tz, Math.min(1, dt * 3));
  if (state === 'menu') cam.x = CANNON_X + W * 0.17 / cam.z + Math.sin(time * 0.3) * 20;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98;
    if (p.grow) p.size += p.grow * dt;
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt * 0.9; t.y -= 40 * dt; if (t.life <= 0) texts.splice(i, 1); }
  for (const o of objs) { if (o.t > 0) o.t -= dt; if (o.squash) o.squash = Math.max(0, o.squash - dt * 4); }

  hud.dist.textContent = Math.floor(run.dist) + ' m';
  hud.best.textContent = 'Best ' + save.best + ' m';
  hud.coin.textContent = save.coins + (state === 'fly' && run.coins ? ' +' + run.coins : '');
}

// ============================================================
//  Render
// ============================================================
let shx = 0, shy = 0;
const wx2sx = x => (x - cam.x) * cam.z + W * 0.35 + shx;
const wy2sy = y => (y - cam.y) * cam.z + H * 0.5 + shy;
function worldT() { ctx.setTransform(cam.z * DPR, 0, 0, cam.z * DPR, (W * 0.35 - cam.x * cam.z + shx) * DPR, (H * 0.5 - cam.y * cam.z + shy) * DPR); }
function screenT() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }

function render() {
  shx = (Math.random() - 0.5) * shake; shy = (Math.random() - 0.5) * shake;
  screenT();
  drawSky();
  drawParallax();
  worldT();
  drawGround();
  drawMarkers();
  for (const o of objs) drawObj(o);
  for (const c of coins) drawCoin(c);
  drawCannon();
  if (state === 'aim' || state === 'power') drawTrajectory();
  for (const p of parts) if (p.smoke) drawPart(p);
  if (rag) drawRag();
  for (const p of parts) if (!p.smoke) drawPart(p);
  for (const t of texts) drawText(t);
  screenT();
  if (state === 'power' || state === 'aim') drawMeters();
  if (rag && state === 'fly') drawOffscreenArrow();
  if (flash > 0) { ctx.fillStyle = `rgba(255,250,220,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
}

function drawSky() {
  const alt = clamp(-cam.y / 3000, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${lerp(70, 30, alt) | 0},${lerp(180, 110, alt) | 0},${lerp(255, 220, alt) | 0})`);
  g.addColorStop(1, '#d4f3ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun
  const sx = W * 0.8, sy = H * 0.18 + (-cam.y - 170) * cam.z * 0.05;
  ctx.fillStyle = 'rgba(255,240,170,.35)'; ctx.beginPath(); ctx.arc(sx, sy, 70, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff2a8'; ctx.beginPath(); ctx.arc(sx, sy, 44, 0, 7); ctx.fill();
  // clouds
  const f = 0.25, z = cam.z;
  const offX = cam.x * f, spacing = 360;
  const i0 = Math.floor((offX - W * 0.35 / z) / spacing) - 1, i1 = Math.ceil((offX + W / z) / spacing) + 1;
  for (let i = i0; i <= i1; i++) {
    const hx = hash(i), hy = hash(i + 99);
    const lx = i * spacing + hx * 200, ly = -260 - hy * 900;
    const sx2 = (lx - offX) * z + W * 0.35, sy2 = (ly - cam.y * f) * z + H * 0.5;
    if (sy2 < -80 || sy2 > H + 80) continue;
    cloud(sx2, sy2, (0.7 + hash(i + 7) * 0.7) * z);
  }
}
function cloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, 7); ctx.arc(x + 30 * s, y - 14 * s, 32 * s, 0, 7); ctx.arc(x + 64 * s, y, 24 * s, 0, 7);
  ctx.rect(x, y - 2 * s, 64 * s, 26 * s);
  ctx.fill();
}
function ridge(f, base, amp, freq, color, seed) {
  const z = cam.z, offX = cam.x * f;
  const by = (base - cam.y * f) * z + H * 0.5 + shy * f;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W + 10; sx += 10) {
    const lx = (sx - W * 0.35) / z + offX;
    const h = Math.sin(lx * freq + seed) * 0.5 + Math.sin(lx * freq * 2.3 + seed * 2) * 0.3 + Math.sin(lx * freq * 5.1 + seed * 3) * 0.2;
    ctx.lineTo(sx, by - (h * 0.5 + 0.5) * amp * z);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function drawParallax() {
  ridge(0.12, -60, 260, 0.0025, '#a8d8f0', 1);
  ridge(0.3, -20, 170, 0.004, '#7cc9a0', 4);
  ridge(0.55, 0, 90, 0.007, '#5cb87a', 9);
}

function viewLeft() { return cam.x - (W * 0.35 + 40) / cam.z; }
function viewRight() { return cam.x + (W * 0.65 + 40) / cam.z; }

function drawGround() {
  const L = viewLeft(), R = viewRight();
  const bottom = Math.max(400, (H - wy2sy(0)) / cam.z + 50);
  ctx.fillStyle = '#9b6a3c'; ctx.fillRect(L, 0, R - L, bottom);
  ctx.fillStyle = '#85582f';
  for (let x = Math.floor(L / 120) * 120; x < R; x += 120) {
    ctx.beginPath(); ctx.arc(x + 40, 40 + hash(x) * 40, 8 + hash(x + 1) * 6, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#5cc94f'; ctx.fillRect(L, 0, R - L, 18);
  ctx.fillStyle = '#4bb33f';
  for (let x = Math.floor(L / 160) * 160; x < R; x += 160) ctx.fillRect(x, 0, 80, 18);
  ctx.fillStyle = '#3d9933'; ctx.fillRect(L, 16, R - L, 5);
  // tufts
  ctx.fillStyle = '#6fd65f';
  for (let x = Math.floor(L / 70) * 70; x < R; x += 70) {
    const hx = x + hash(x) * 40;
    ctx.beginPath(); ctx.moveTo(hx, 0); ctx.lineTo(hx + 4, -9); ctx.lineTo(hx + 8, 0); ctx.lineTo(hx + 11, -6); ctx.lineTo(hx + 14, 0); ctx.fill();
  }
}

function drawMarkers() {
  const L = viewLeft(), R = viewRight(), step = 50 * PX_PER_M;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let x = Math.max(step, Math.floor(L / step) * step); x < R; x += step) {
    ctx.fillStyle = '#6b4423'; ctx.fillRect(x - 3, -60, 6, 60);
    roundRect(x - 26, -82, 52, 26, 6, '#fff6e0', '#2b1d0e', 3);
    ctx.fillStyle = '#2b1d0e'; ctx.font = '16px "Lilita One", sans-serif';
    ctx.fillText((x / PX_PER_M) + 'm', x, -68);
  }
  if (save.best > 0) {
    const bx = save.best * PX_PER_M;
    if (bx > L && bx < R) {
      ctx.fillStyle = '#2b1d0e'; ctx.fillRect(bx - 2, -120, 4, 120);
      const wave = Math.sin(time * 5) * 3;
      ctx.fillStyle = '#ff4d3d'; ctx.beginPath(); ctx.moveTo(bx + 2, -120); ctx.lineTo(bx + 46, -110 + wave); ctx.lineTo(bx + 2, -96); ctx.fill();
      ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '12px "Lilita One", sans-serif'; ctx.fillText('BEST', bx + 20, -109 + wave / 2);
    }
  }
}

function roundRect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
}

function drawObj(o) {
  const L = viewLeft(), R = viewRight();
  if (o.x + 140 < L || o.x - 140 > R) return;
  const INK = '#2b1d0e';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  switch (o.type) {
    case 'tramp': {
      const sq = (o.squash || 0) * 10, top = -26 + sq;
      ctx.strokeStyle = INK; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(o.x + 14, 0); ctx.lineTo(o.x + 22, -24); ctx.moveTo(o.x + o.w - 14, 0); ctx.lineTo(o.x + o.w - 22, -24); ctx.stroke();
      ctx.strokeStyle = '#3aa0ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(o.x + 14, 0); ctx.lineTo(o.x + 22, -24); ctx.moveTo(o.x + o.w - 14, 0); ctx.lineTo(o.x + o.w - 22, -24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o.x, -26); ctx.quadraticCurveTo(o.x + o.w / 2, top + sq, o.x + o.w, -26);
      ctx.strokeStyle = INK; ctx.lineWidth = 10; ctx.stroke();
      ctx.strokeStyle = '#ff4d3d'; ctx.lineWidth = 6; ctx.stroke();
      roundRect(o.x - 6, -32, 12, 12, 4, '#3aa0ff', INK, 3); roundRect(o.x + o.w - 6, -32, 12, 12, 4, '#3aa0ff', INK, 3);
      break;
    }
    case 'tnt': {
      roundRect(o.x, -50, o.w, 50, 6, '#e8382b', INK, 4);
      ctx.fillStyle = '#b8261a'; ctx.fillRect(o.x + 2, -40, o.w - 4, 6); ctx.fillRect(o.x + 2, -16, o.w - 4, 6);
      ctx.fillStyle = '#fff'; ctx.font = '15px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('TNT', o.x + o.w / 2, -24);
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(o.x + o.w / 2, -50); ctx.quadraticCurveTo(o.x + o.w / 2 + 6, -62, o.x + o.w / 2 + 12, -60); ctx.stroke();
      if ((time * 8 | 0) % 2) { ctx.fillStyle = '#ffd84d'; ctx.beginPath(); ctx.arc(o.x + o.w / 2 + 13, -61, 4, 0, 7); ctx.fill(); }
      break;
    }
    case 'balloon': {
      const by = o.y + Math.sin(time * 2 + o.phase) * 8, col = BALLOON_COLORS[o.hue];
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(o.x, by + 28);
      ctx.quadraticCurveTo(o.x + 8, by + 48, o.x, by + 68); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(o.x, by, 22, 27, 0, 0, 7); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o.x - 5, by + 30); ctx.lineTo(o.x + 5, by + 30); ctx.lineTo(o.x, by + 25); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(o.x - 8, by - 10, 5, 9, -0.4, 0, 7); ctx.fill();
      break;
    }
    case 'pad': {
      roundRect(o.x, -10, o.w, 12, 4, o.used ? '#9b9b9b' : '#ffd23a', INK, 3);
      ctx.fillStyle = o.used ? '#666' : INK;
      for (let i = 0; i < 4; i++) {
        const px = o.x + 18 + i * 28, on = !o.used && ((time * 6 | 0) % 4) === i;
        ctx.fillStyle = on ? '#ff4d3d' : (o.used ? '#666' : INK);
        ctx.beginPath(); ctx.moveTo(px, -8); ctx.lineTo(px + 12, -4); ctx.lineTo(px, 0); ctx.lineTo(px + 4, -4); ctx.fill();
      }
      break;
    }
    case 'ring': {
      const pul = 1 + Math.sin(time * 6) * 0.05;
      ctx.save(); ctx.translate(o.x, o.y); ctx.scale(pul, pul);
      ctx.beginPath(); ctx.ellipse(0, 0, 16, 48, 0, 0, 7);
      ctx.strokeStyle = INK; ctx.lineWidth = 12; ctx.stroke();
      ctx.strokeStyle = o.used ? '#bbb' : '#ffd23a'; ctx.lineWidth = 7; ctx.stroke();
      if (!o.used) {
        ctx.fillStyle = 'rgba(255,240,150,.25)'; ctx.fill();
        ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(30, -10); ctx.lineTo(46, 0); ctx.lineTo(30, 10); ctx.fill();
      }
      ctx.restore();
      break;
    }
    case 'cactus': {
      const cx = o.x + o.w / 2;
      ctx.strokeStyle = INK; ctx.lineWidth = 26;
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, -70); ctx.stroke();
      ctx.lineWidth = 16;
      ctx.beginPath(); ctx.moveTo(cx - 6, -34); ctx.lineTo(cx - 26, -34); ctx.lineTo(cx - 26, -56); ctx.moveTo(cx + 6, -44); ctx.lineTo(cx + 24, -44); ctx.lineTo(cx + 24, -62); ctx.stroke();
      ctx.strokeStyle = '#3fa34d'; ctx.lineWidth = 20;
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, -70); ctx.stroke();
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(cx - 6, -34); ctx.lineTo(cx - 26, -34); ctx.lineTo(cx - 26, -56); ctx.moveTo(cx + 6, -44); ctx.lineTo(cx + 24, -44); ctx.lineTo(cx + 24, -62); ctx.stroke();
      ctx.strokeStyle = '#2b7a36'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - 3, -6); ctx.lineTo(cx - 3, -66); ctx.moveTo(cx + 3, -6); ctx.lineTo(cx + 3, -66); ctx.stroke();
      ctx.fillStyle = '#ff6fae'; ctx.beginPath(); ctx.arc(cx, -82, 5, 0, 7); ctx.fill();
      break;
    }
  }
}

function drawCoin(c) {
  const L = viewLeft(), R = viewRight();
  if (c.x < L || c.x > R) return;
  const sx = Math.abs(Math.cos(time * 4 + c.x * 0.02));
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(Math.max(0.15, sx), 1);
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fillStyle = '#ffcb2e'; ctx.fill();
  ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.strokeStyle = '#d99a00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawCannon() {
  const INK = '#2b1d0e';
  const a = angle * Math.PI / 180;
  // platform
  roundRect(CANNON_X - 60, -14, 120, 16, 4, '#8a8f99', INK, 3);
  // barrel
  ctx.save(); ctx.translate(CANNON_X, PIVOT_Y); ctx.rotate(-a); ctx.translate(-recoil * 16, 0);
  const g = ctx.createLinearGradient(0, -20, 0, 20);
  g.addColorStop(0, '#5b6270'); g.addColorStop(0.35, '#8d95a5'); g.addColorStop(1, '#2f343d');
  ctx.beginPath(); ctx.moveTo(-34, -22); ctx.lineTo(BARREL_LEN - 6, -17); ctx.lineTo(BARREL_LEN - 6, 17); ctx.lineTo(-34, 22);
  ctx.arc(-34, 0, 22, Math.PI / 2, -Math.PI / 2); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  roundRect(BARREL_LEN - 14, -22, 18, 44, 5, '#ff4d3d', INK, 4);
  roundRect(18, -21, 10, 42, 3, '#ffcb2e', INK, 3);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-30, -14, BARREL_LEN - 30, 5);
  if (state === 'aim' || state === 'power' || state === 'menu') {
    // dummy head peeking out of the muzzle
    ctx.beginPath(); ctx.arc(BARREL_LEN + 4, 0, 11, 0, 7); ctx.fillStyle = '#ffd23a'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(BARREL_LEN + 8, -4, 2, 0, 7); ctx.arc(BARREL_LEN + 8, 4, 2, 0, 7); ctx.fill();
  }
  ctx.restore();
  // carriage + wheel
  ctx.beginPath(); ctx.moveTo(CANNON_X - 40, -12); ctx.lineTo(CANNON_X - 14, PIVOT_Y - 8); ctx.lineTo(CANNON_X + 14, PIVOT_Y - 8); ctx.lineTo(CANNON_X + 34, -12); ctx.closePath();
  ctx.fillStyle = '#b5652b'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.arc(CANNON_X, -24, 20, 0, 7); ctx.fillStyle = '#7a4520'; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ffcb2e'; ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) { const r = i * Math.PI / 4 + time * 0; ctx.beginPath(); ctx.moveTo(CANNON_X + Math.cos(r) * 15, -24 + Math.sin(r) * 15); ctx.lineTo(CANNON_X - Math.cos(r) * 15, -24 - Math.sin(r) * 15); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(CANNON_X, PIVOT_Y, 6, 0, 7); ctx.fillStyle = '#ffcb2e'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
}

function drawTrajectory() {
  const a = angle * Math.PI / 180;
  const p = state === 'power' ? powerV : 0.55;
  const speed = 1550 * (1 + save.power * 0.08) * (0.4 + 0.6 * p);
  let x = CANNON_X + Math.cos(a) * BARREL_LEN, y = PIVOT_Y - Math.sin(a) * BARREL_LEN;
  let vx = Math.cos(a) * speed, vy = -Math.sin(a) * speed;
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 26; i++) {
    for (let k = 0; k < 4; k++) { vy += G * 0.012; x += vx * 0.012; y += vy * 0.012; }
    if (y > 0) break;
    ctx.globalAlpha = 1 - i / 26;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMeters() {
  const INK = '#2b1d0e';
  const bw = 30, bh = Math.min(220, H * 0.35), bx = 18, by = H * 0.5 - bh / 2;
  roundRect(bx, by, bw, bh, 10, 'rgba(255,246,224,.9)', INK, 4);
  const fill = state === 'power' ? powerV : 0;
  const g = ctx.createLinearGradient(0, by + bh, 0, by);
  g.addColorStop(0, '#4fd16a'); g.addColorStop(0.6, '#ffd23a'); g.addColorStop(1, '#ff4d3d');
  ctx.save(); ctx.beginPath(); ctx.rect(bx + 4, by + 4 + (bh - 8) * (1 - fill), bw - 8, (bh - 8) * fill); ctx.clip();
  roundRect(bx + 4, by + 4, bw - 8, bh - 8, 6, g); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = '16px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.lineWidth = 4; ctx.strokeStyle = INK;
  ctx.strokeText('POWER', bx + bw / 2 + 4, by + bh + 8); ctx.fillText('POWER', bx + bw / 2 + 4, by + bh + 8);
  const ang = Math.round(angle) + '°';
  ctx.font = '22px "Lilita One", sans-serif';
  ctx.strokeText(ang, bx + bw / 2 + 4, by - 32); ctx.fillText(ang, bx + bw / 2 + 4, by - 32);
}

function drawOffscreenArrow() {
  const h = rag.p.head, sy = wy2sy(h.y);
  if (sy > 8) return;
  const sx = wx2sx(h.x);
  ctx.fillStyle = '#ff4d3d'; ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx, 14); ctx.lineTo(sx - 12, 34); ctx.lineTo(sx + 12, 34); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '14px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.strokeText(Math.floor(-h.y / PX_PER_M) + 'm', sx, 38); ctx.fillText(Math.floor(-h.y / PX_PER_M) + 'm', sx, 38);
}

function limb(a, b, w, color) {
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = w + 6; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function limb2(a, b, c, w, color) {
  for (const [lw, col] of [[w + 6, '#2b1d0e'], [w, color]]) {
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y);
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
  }
}
function dummyMark(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = '#ffd23a'; ctx.fill();
  ctx.fillStyle = '#2b1d0e';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, 0, Math.PI / 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, Math.PI, Math.PI * 1.5); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function drawRag() {
  const p = rag.p, Y = '#ffd23a', Yd = '#e6b21a';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // shadow
  const sh = clamp(1 - (-p.hip.y) / 600, 0, 1);
  if (sh > 0) { ctx.fillStyle = `rgba(0,0,0,${0.22 * sh})`; ctx.beginPath(); ctx.ellipse(p.hip.x, 2, 28 * sh + 6, 5 * sh + 1, 0, 0, 7); ctx.fill(); }
  limb2(p.hip, p.lKnee, p.lFoot, 10, Yd);
  limb2(p.neck, p.lElb, p.lHand, 8, Yd);
  // torso
  limb(p.neck, p.hip, 18, '#3a6fd8');
  ctx.beginPath(); ctx.moveTo(p.hip.x, p.hip.y); ctx.lineTo(lerp(p.hip.x, p.neck.x, 0.25), lerp(p.hip.y, p.neck.y, 0.25));
  ctx.strokeStyle = '#26478f'; ctx.lineWidth = 18; ctx.stroke();
  const ta = Math.atan2(p.hip.y - p.neck.y, p.hip.x - p.neck.x);
  dummyMark(lerp(p.neck.x, p.hip.x, 0.45), lerp(p.neck.y, p.hip.y, 0.45), 5, ta);
  limb2(p.hip, p.rKnee, p.rFoot, 10, Y);
  // feet
  for (const f of [p.lFoot, p.rFoot]) { ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 7); ctx.fillStyle = '#2b1d0e'; ctx.fill(); }
  limb2(p.neck, p.rElb, p.rHand, 8, Y);
  for (const hnd of [p.lHand, p.rHand]) { ctx.beginPath(); ctx.arc(hnd.x, hnd.y, 5.5, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 2.5; ctx.stroke(); }
  // head
  const h = p.head, ha = Math.atan2(h.y - p.neck.y, h.x - p.neck.x) + Math.PI / 2;
  ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(ha);
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fillStyle = Y; ctx.fill(); ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 3; ctx.stroke();
  dummyMark(-6, -3, 4, 0);
  ctx.fillStyle = '#2b1d0e'; ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 2;
  if (run.ko > 0) {
    for (const ex of [3, 9]) { ctx.beginPath(); ctx.moveTo(ex - 2.5, -5.5); ctx.lineTo(ex + 2.5, -0.5); ctx.moveTo(ex + 2.5, -5.5); ctx.lineTo(ex - 2.5, -0.5); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(7, 5, 3, 2.5, 0, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(3.5, -3, 2.2, 0, 7); ctx.arc(9, -3, 2.2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(6, 3, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  ctx.restore();
  if (run.ko > 0) { // dizzy stars
    for (let i = 0; i < 3; i++) {
      const a = time * 6 + i * 2.1;
      star(h.x + Math.cos(a) * 18, h.y - 18 + Math.sin(a) * 5, 4);
    }
  }
}
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = '#fff36b'; ctx.fill(); ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 1.2; ctx.stroke();
}
function drawPart(p) {
  ctx.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1) * (p.smoke ? 0.6 : 1);
  ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawText(t) {
  const s = 1 + (1 - t.life) * 0.3, z = 1 / Math.max(0.6, cam.z / baseZ);
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s * z, s * z); ctx.globalAlpha = clamp(t.life * 2, 0, 1);
  ctx.font = '30px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 6; ctx.strokeStyle = '#2b1d0e'; ctx.strokeText(t.s, 0, 0);
  ctx.fillStyle = t.color; ctx.fillText(t.s, 0, 0);
  ctx.restore();
}

// ============================================================
//  Main loop
// ============================================================
resetWorld();
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
requestAnimationFrame(frame);

// tiny debug/test hook
window.__flop = { get state() { return state; }, get run() { return run; }, tap, startAim, save };
})();
</script>
</body>
</html>
